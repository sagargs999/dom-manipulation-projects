<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles\10-rock-paper-scissors.css">
    </style>
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button onclick="
      playGame('rock');
    " class="move-button"><img src="imgs/Rock.png" class="move-icon"></button>

    <button onclick="
      playGame('paper');
    " class="move-button"><img src="imgs/paper.png" class="move-icon" ></button>

    <button onclick="
      playGame('scissors');
    " class="move-button"><img src="imgs\scissors.png" class="move-icon"></button>

    <p class="js_result result"></p>
    <p class="js_moves"></p>
    <p class="js_score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updatescore();
    "
    class="reset-button"
    >Reset Score</button>

    <script src="10-rock-paper-scissors.js">
      
    </script>
  </body>
</html>
