<!doctype html>
<html>
  <head>
    <title>DOM project</title>
    <style>
      .subscribe-butt
      {
        border: none;
        background-color: black;
        color: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 15px;
        padding-right: 15px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        margin-bottom: 30px;
      }
      .is-subscribed{
        background-color: rgb(240, 240, 240);
        color: black;
      }
      body{
        font-family: Arial;

      }
      .cost-input{
        font-size: 15px;
        /*
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        */
        padding: 10px;
      }
      .calculate-button{
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 10px 15px;
        cursor: pointer;

      }
    </style>
  </head>
  <body>
    <p>subscribe my channel</p>
    <button onclick="
    subscribe();
    " class="js_sub-button subscribe-butt">Subscribe</button><br>

    <a href="rock-paper-scissor.html">rock-paper-scissors-game</a>

    <p>Amazon shipping calculator</p>
    <input placeholder="cost of order" class="js_cost cost-input" onkeydown="
    //console.log(event.key);
    handlekey(event);
    
    ">
    <button onclick="
     calctotal();
    " class="calculate-button">calculate</button>
    <p class="js_totalcost"></p>

    <script>


      function handlekey(event){
        if(event.key === 'Enter'){
              calctotal();
            }
      }

      function calctotal(){
       const inputele = document.querySelector('.js_cost');
        let cost = Number(inputele.value);
        if (cost < 40){
         cost=cost+10;
      }
      document.querySelector('.js_totalcost').innerHTML=`$${cost}`;

      }

      function subscribe(){
    const butele=document.querySelector('.js_sub-button');
    if(butele.innerText === 'Subscribe'){
      butele.innerHTML='Subscribed';
      butele.classList.add('is-subscribed');

    }else {
      butele.innerHTML='Subscribe';
      butele.classList.remove('is-subscribed');

    }


      }
      
      </script>
  </body>
</html>
